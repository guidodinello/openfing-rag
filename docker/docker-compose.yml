services:
    database:
        image: pgvector/pgvector:pg17
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${DATABASE__USER}
            POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
            POSTGRES_DB: ${DATABASE__DB}
            PG_VECTOR_DIMENSION: ${EMBEDDINGS__DIMENSION}
            POSTGRES_MAX_CONNECTIONS: 100
            PGDATA: /var/lib/postgresql/data/pgdata
            POSTGRES_SHARED_PRELOAD_LIBRARIES: vector
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - backend
        expose:
            - "5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DATABASE__USER} -d ${DATABASE__DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
            target: production
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - ../backend/logs:${LOG__DIR}
            - ../audios:${DOWNLOADER__OUTPUT_DIR}
            - ../transcriptions:${TRANSCRIBER__OUTPUT_DIR}
            - ../models_cache:${EMBEDDINGS__CACHE_DIR}
        depends_on:
            database:
                condition: service_healthy
        networks:
            - backend
        expose:
            - "8000"
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:${SERVER__PORT}/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    # Por ahora omitimos frontend hasta que esté listo
    # frontend:
    #   build:
    #     context: ../frontend
    #     dockerfile: Dockerfile
    #     target: production
    #   restart: unless-stopped
    #   environment:
    #     - REACT_APP_API_URL=http://localhost/api
    #   networks:
    #     - frontend
    #   depends_on:
    #     - backend

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        # 🌐 ONLY nginx exposed to the world
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/conf.d:/etc/nginx/conf.d
            - nginx_cache:/var/cache/nginx
            - certbot_conf:/etc/letsencrypt:ro
            - certbot_www:/var/www/certbot
        depends_on:
            - backend
            # - frontend  # Comentar hasta que frontend esté listo
        networks:
            - backend
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "--no-check-certificate",
                    "https://localhost/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    certbot:
        image: certbot/certbot:latest
        volumes:
            - certbot_conf:/etc/letsencrypt
            - certbot_www:/var/www/certbot
        command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN_NAME}
        depends_on:
            - nginx

    certbot-renewal:
        image: certbot/certbot:latest
        volumes:
            - certbot_conf:/etc/letsencrypt
            - certbot_www:/var/www/certbot
        depends_on:
            - nginx
        restart: unless-stopped
        # is using sleep like this appropiate? or should this be a proper cron job?
        entrypoint: >
            sh -c "
            while :; do
                sleep 12h;
                certbot renew --webroot --webroot-path=/var/www/certbot;
            done"

volumes:
    postgres_data:
        driver: local
    nginx_cache:
        driver: local
    certbot_conf:
        driver: local
    certbot_www:
        driver: local

networks:
    backend:
        driver: bridge
