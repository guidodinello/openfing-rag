services:
    database:
        image: pgvector/pgvector:pg17
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            POSTGRES_USER: ${DATABASE__USER}
            POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
            POSTGRES_DB: ${DATABASE__DB}
            PG_VECTOR_DIMENSION: ${EMBEDDINGS__DIMENSION}
            POSTGRES_SSL_MODE: require
            POSTGRES_HOST_AUTH_METHOD: md5

            POSTGRES_MAX_CONNECTIONS: 100
            PGDATA: /var/lib/postgresql/data/pgdata
            POSTGRES_SHARED_PRELOAD_LIBRARIES: vector
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - database
        expose:
            - "5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DATABASE__USER} -d ${DATABASE__DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
            target: production
        restart: unless-stopped
        env_file:
            - ../.env
        volumes:
            - ../logs:${LOG__DIR}
            - ../audios:${DOWNLOADER__OUTPUT_DIR}
            - ../transcriptions:${TRANSCRIBER__OUTPUT_DIR}
            - ../models_cache:${EMBEDDINGS__CACHE_DIR}
        depends_on:
            database:
                condition: service_healthy
        networks:
            - backend
            - database
        expose:
            - "8000"
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:${SERVER__PORT}/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile
            target: production
            args:
                - VITE_API_URL=${VITE_API_URL}
                - VITE_APP_TITLE=${VITE_APP_TITLE}
                - VITE_APP_VERSION=${APP__VERSION}
        restart: unless-stopped
        networks:
            - frontend
        expose:
            - "80"
        depends_on:
            - backend
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        # 🌐 ONLY nginx exposed to the world
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/conf.d:/etc/nginx/conf.d
            - nginx_cache:/var/cache/nginx
            - certbot_conf:/etc/letsencrypt:ro
            - certbot_www:/var/www/certbot
        depends_on:
            - backend
            - frontend
        networks:
            - backend
            - frontend
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "--no-check-certificate",
                    "https://localhost/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    certbot-renewal:
        image: certbot/certbot:latest
        volumes:
            - certbot_conf:/etc/letsencrypt
            - certbot_www:/var/www/certbot
        depends_on:
            - nginx
        restart: unless-stopped
        # Using sleep like this is fine for simple setups, but you could also use a proper cron container
        entrypoint: >
            sh -c "
            while :; do
                sleep 12h;
                certbot renew --webroot --webroot-path=/var/www/certbot;
            done"

    certbot:
        image: certbot/certbot:latest
        volumes:
            - certbot_conf:/etc/letsencrypt
            - certbot_www:/var/www/certbot
        command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN_NAME}
        depends_on:
            - nginx

    migration:
        build:
            context: ../backend
            dockerfile: Dockerfile
            target: production
        env_file:
            - ../.env
        depends_on:
            database:
                condition: service_healthy
        networks:
            - database
        command: ["openchat-db", "migrate"]
        restart: "no"
        profiles:
            - migration

volumes:
    postgres_data:
        driver: local
    nginx_cache:
        driver: local
    certbot_conf:
        driver: local
    certbot_www:
        driver: local

networks:
    database:
        driver: bridge
        internal: true
    backend:
        driver: bridge
    frontend:
        driver: bridge
