services:
    frontend:
        build:
            context: ../frontend/
            dockerfile: Dockerfile
        ports:
            - "3000:80"
        networks:
            - app-network
        depends_on:
            - generative
            - transcriptions
            - scrapping
            - database

    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
        ports:
            - "8001:8000"
        networks:
            - app-network
        volumes:
            - ../backend/.env:/app/.env:ro
        depends_on:
            database:
                condition: service_healthy

    database:
        image: pgvector/pgvector:pg17
        ports:
            - "${DATABASE__PORT:-5432}:5432"
        environment:
            POSTGRES_USER: ${DATABASE__USER}
            POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
            POSTGRES_DB: ${DATABASE__DB}

            # Optimizations for pgvector
            POSTGRES_MAX_CONNECTIONS: 100
            PGDATA: /var/lib/postgresql/data/pgdata
            POSTGRES_SHARED_PRELOAD_LIBRARIES: vector
            # Vector dimension should match your embedding model
            # - All-MiniLM-L6-v2: 384
            # - text-embedding-3-small: 1536
            # - intfloat/multilingual-e5-base: 768
            PG_VECTOR_DIMENSION: ${EMBEDDINGS__DIMENSION}

        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    app-network:
        driver: bridge
volumes:
    postgres_data:
        driver: local
