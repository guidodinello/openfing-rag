services:
    frontend:
        build:
            context: ../frontend/
            dockerfile: Dockerfile
        ports:
            - "3000:80"
        networks:
            - app-network
        depends_on:
            - generative
            - transcriptions
            - scrapping
            - database

    generative:
        build:
            context: ../backend/generative/
            dockerfile: Dockerfile
        ports:
            - "8001:8000"
        networks:
            - app-network
        volumes:
            - ../backend/generative/.env:/app/.env:ro
        depends_on:
            database:
                condition: service_healthy

    transcriptions:
        build:
            context: ../backend/transcriptions
            dockerfile: Dockerfile
        ports:
            - "8002:8000"
        networks:
            - app-network
        environment:
            - DATABASE_URL=postgres://user:password@database:5432/mydb
        depends_on:
            - database

    scrapping:
        build:
            context: ../backend/scraping
            dockerfile: Dockerfile
        ports:
            - "8003:8000"
        networks:
            - app-network
        environment:
            - DATABASE_URL=postgres://user:password@database:5432/mydb
        depends_on:
            - database

    database:
        image: postgres:alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=mydb
        volumes:
            - ./database/data:/var/lib/postgresql/data
            - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - app-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    app-network:
        driver: bridge
