[project]
name = "transcriptions"
version = "0.1.0"
description = "Audio transcription service using Whisper"
requires-python = ">=3.12"
dependencies = [
    "openai-whisper>=20240930",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
]

[project.scripts]
transcription-server = "main:start_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
