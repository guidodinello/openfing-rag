[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downloader"
version = "0.1.0"
description = "Download videos from OpenFing and extract audio"
authors = [
    {name = "Guido Dinello", email = "guido.dinello@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.31.0",
    "yt-dlp>=2024.3.10",
    "prefect>=3.4.1",
]

[project.scripts]
openfing-dl = "downloader.cli:app"
