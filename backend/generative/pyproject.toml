[project]
name = "app"
version = "0.1.0"
description = "RAG powered chatbot with educational video transcriptions"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9,<4.0"
authors = [
    { name = "Guido Dinello", email = "Guido Dinello <guido.dinello@gmail.com>" },
]

dependencies = [
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.2",
    "prefect>=3.1.1",
    "sqlalchemy-utils>=0.41.2",
    "alembic>=1.14.0",
    "langchain-postgres>=0.0.12",
    "sentence-transformers>=3.3.1",
    "langchain-huggingface>=0.1.2",
    "openai-whisper>=20240930",
    "faker (>=37.1.0,<38.0.0)",
]

[project.urls]
repository = "https://gitlab.fing.edu.uy/diego.amorena/tesis"

[project.scripts]
cli = "cli:app"
start = "cli:start"
dev = "cli:dev"


[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "black>=24.10.0",
    "faker>=33.0.0",
    "typer>=0.13.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends",]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
strict_equality = true
ignore_missing_imports = true
